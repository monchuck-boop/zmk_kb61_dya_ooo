# 右側（Right）を親機（PCと直接Bluetooth/USB通信する側）に指定
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# 右手単体で動かすため、左手を探しに行く無線通信（スプリット）を「無効」に強制固定する
# これにより、ZMKが右手基板の物理ピンから全5列（29キー）を直接スキャンするようになります
CONFIG_ZMK_SPLIT=n

# エラー回避：無効化されていたBluetoothとUSBのコア機能を強制的にONにする
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# システムライブラリ(picolibc)で拡張文字列処理関数(snprintfなど)を正常に有効化する
CONFIG_PICOLIBC_IO_LONG_LONG=y

CONFIG_ZMK_USB=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

